on value="24">24　回歸檢查</option><option value="25">25　上一輪彩排觀察</option><option value="26">26　除錯 prompt：首尾相接</option><option value="27">27　彩排用量與費用換算</option><option value="28">28　同一個 UX，一致的 UI</option><option value="29">29　情境選型表</option><option value="30">30　PDCA 與專案知識管理</option><option value="31">31　課後延伸與教材導覽</option><option value="32">32　Q&A</option><option value="33">33　Codex CLI 對應操作</option><option value="34">34　macOS／Windows 環境檢查</option><option value="35">35　額度、網路與啟動問題</option><option value="36">36　延伸 prompt：匯出行事曆</option><option value="37">37　完整實測紀錄表</option><option value="38">38　資料與官方參考網址</option><option value="39">39　費用估算與比較範圍</option><option value="40">40　原投稿題目：Roblox Studio AI</option><option value="41">41　Lovable 的發布與網域</option><option value="42">42　Lovable 整合好的開發工具</option><option value="43">43　第三方服務與 connectors</option><option value="44">44　課後延伸：兩個實作系列</option></select> <button id="next">下一頁</button> <button id="toggle">講者備註</button> <button id="extras-toggle">本頁提示／附件</button> <button id="bonus">補充內容</button> <button id="subscriptions">訂閱 QR</button> <button id="full">全螢幕</button></div><span id="count"></span></header><figure><img id="slide" alt=""></figure><section id="notes" hidden></section><section id="extras" hidden></section><script>const slides=[{"n":1,"title":"入場準備","kind":"list","subtitle":"13:00–13:30　環境準備時間","items":[["帳號已登入","Lovable，以及你慣用的通用 AI 工具"],["電腦能執行專案","Node.js、npm、瀏覽器與穩定網路"],["教材已解壓","先開啟學員講義，再準備空白專案"]],"notes":{"time":"準備時段，約 10 分鐘循環顯示","talk":"歡迎各位。請先確認帳號可以使用，不要急著送出建置需求。今天會比較兩條路徑，請先保留 Lovable 的可用額度。 如果今天的 5 點已經用完，請掃第 3 頁的 QR Code 填群組申請，留下 Lovable 登入 email，再向我示意。","action":"打開學員講義的環境準備。請已完成的人協助鄰座。","check":"學員能指出自己的工具、帳號與教材所在位置。","transition":"接著確認本機起始專案。","sources":["S1"]}},{"n":2,"title":"教材與起始專案","kind":"steps","subtitle":"先把空白頁跑起來","items":[["解壓 starter","空白工具鏈與 70 筆 HWDC 公開議程"],["npm ci","第一次安裝需要網路"],["npm run dev","開啟終端機顯示的本機網址"]],"bottom":"看到「環境已就緒」後，保留這份空白起點","notes":{"time":"準備時段，約 10 分鐘","talk":"起始專案尚未實作搜尋、收藏或衝堂提示。請先不要打開參考解答。設定及安裝時間會另外記錄，正式建置才開始 15 分鐘計時。","action":"在 starter 終端機示範兩個指令，指出需要停留在有 package.json 的資料夾。","check":"學員能看到空白頁，知道本機網址。","transition":"最後確認額度與卡關時的接續方法。","sources":["S14"]}},{"n":3,"title":"Lovable 額度不足？申請加入群組","kind":"qr","subtitle":"今天的 5 點已用完，或可用額度不足時再填寫","steps":["1　掃右側 QR Code","2　填入 Lovable 登入 email","3　向講師示意，留意邀請信"],"bottom":"仍卡關超過 2 分鐘，保留紀錄並改用離線參考版","qrImage":"../materials/qr/lovable-group-application.png","links":[{"label":"Lovable 群組加入申請","url":"https://forms.gle/pt3nLWy622sYTfsG6"},{"label":"申請說明與 QR Code","url":"../materials/lovable-group-application.html"}],"notes":{"time":"準備時段，約 10 分鐘","talk":"免費建置額度不是固定五次提示。今天的 5 點已用完或額度不足時，請掃右側 QR Code，只需填登入 Lovable 的 email。表單開放持連結者填寫，不要求登入 Google，也不公開其他人的回覆。送出後向講師示意。講師查看 Google 表單回覆，再安排 Lovable 群組邀請；申請送出不會自動加入。收到信後完成加入，確認可以繼續實作。仍無法建置時，保留狀態並以離線版做驗收。","action":"投影 QR Code 與可點選短網址。講師於自己的表單「回覆」分頁查看 email，再安排群組邀請；請學員確認信箱。需要在正式流程中再次顯示 QR 時，也可開第 35 頁附錄。","check":"申請者填的是 Lovable 登入 email，知道需完成邀請流程。所有人記錄額度來源與切換時間，卡關者知道離線備援位置。","transition":"13:30 開始正式課程。","sources":["S3","S4","S18"]}},{"n":4,"title":"通用 AI CLI vs. 場景專用 AI","kind":"cover","subtitle":"以 Lovable Web 開發為例的效能實測","author":"林建宏 Wolke Lin","event":"HWDC 2026　10/14　13:30–15:00","notes":{"time":"13:30–13:30:30，30 秒","talk":"歡迎來到 HWDC 2026。今天用同一份 Web 需求，親自觀察 Lovable 與通用 AI 工具的建置、修改與驗收。我會以 Codex 桌面 App 示範，CLI 操作放在附錄。","action":"確認投影與音量，說明今天的工具與共同任務，接著切到講師介紹。","check":"確認全場能看清投影字體。","transition":"先用一分鐘介紹我自己，以及我平常在做的事。","sources":["S1"]},"medium":"medium.com/@wolkesau"},{"n":5,"title":"關於我：林建宏 Wolke Lin","kind":"bio","subtitle":"分享 AI 協作與程式開發經驗，讓更多人動手做","image":"../materials/speaker/wolke-portrait.png","identity":"啟發者","credentials":["曾任 Google Developer Expert（2019–2023）","曾任 LINE API Expert"],"roles":["技術書作者","大學講師、社群與論壇講者"],"books":["實用的 Gemini API 開發點子書","ChatGPT 程式開發","LINE 聊天機器人"],"links":[{"label":"Medium 個人頁","url":"https://medium.com/@wolkesau"},{"label":"置頂自我介紹","url":"https://medium.com/wolkesau/wolke-林建宏-自我介紹-6fbddfef865a"},{"label":"完整著作書目","url":"https://wolkesau.medium.com/books"},{"label":"最新系列自介與資格年份","url":"https://ithelp.ithome.com.tw/articles/10406618"}],"notes":{"time":"13:30:30–13:32，1 分 30 秒","talk":"我是林建宏，大家也可以叫我 Wolke。我把自己定位成一名啟發者，希望把開發過程中的經驗與問題分享出來，幫助更多人理解並開始行動。我曾任 Google Developer Expert（2019–2023）與 LINE API Expert，也是技術書作者，曾在大學、社群與論壇講授。我的著作涵蓋 Gemini API、ChatGPT 協作程式開發和 LINE 聊天機器人。近期的書是《實用的 Gemini API 開發點子書》。我在 Medium 持續分享 AI 人機協作與提示工程。今天想和大家一起做的，是把需求說清楚，再親手檢查 AI 做出的成果。","action":"介紹照片、專業資格與著作。用約一分鐘講背景，最後 30 秒連到今天的 AI 協作與驗收主題。Medium 網址可點選，完整書名與來源在本頁備註及教材。 自我介紹頁右側 QR Code 連到 https://medium.com/@wolkesau，介紹時可停留讓學員掃描。","check":"聽眾理解講師的實作與教學背景，以及本堂課為何重視需求、操作和驗收。","transition":"我們先看看今天會做出的議程收藏器，以及你會帶走什麼。","sources":["S11","S12","S13","S19"]},"qr":{"image":"../materials/speaker/medium-wolkesau-qr.png","url":"https://medium.com/@wolkesau"}},{"n":6,"title":"今天的成品與學習目標","kind":"image","image":"01-v1-desktop.png","subtitle":"研討會議程收藏器：UI 自訂，兩個版本保持一致","imageCaption":"參考 UI；收藏需在重新整理後保留","items":[["兩個初版","各用一套工具完成搜尋與收藏"],["一次需求變更","加入衝堂提示，再做回歸檢查"],["一份選型理由","依完成度、時間與用量比較"]],"notes":{"time":"13:32–13:35，3 分鐘","talk":"今天要完成的是找議程、收藏、重新整理後保留，再加上衝堂提示。這張畫面是使用真實議程附件的參考版，UI 只是其中一種可能。學員可自行決定 UI 設計，但 Lovable 與通用 AI 的兩個版本要保持一致。兩套工具各做一個初版，各接受一次相同的需求變更，再以完成度、時間與用量寫下自己的選型理由。你可以沿用熟悉的通用 AI 工具，只要需求與資料相同，並記錄條件。","action":"先用 90 秒操作離線參考版：搜尋林建宏，收藏 4996、5030，重新整理確認保留，再切第二版加入 5018 看衝堂。接著 60 秒說明兩段 15 分鐘初版與各 5 分鐘修改。最後 30 秒舉手詢問工具分布，提醒同學可使用自己的通用工具。","check":"請學員說出畫面尚未證明的功能，例如重新整理保存。確認知道 UI 由學員自訂，但自己的兩個工具版本須一致、通用工具可以自選，而且要留下作品與觀察紀錄。","transition":"先看兩類工具在工作流程中的差別。","sources":["S14"]}},{"n":7,"title":"通用與場景專用工具","kind":"table","subtitle":"以工作範圍與整合方式理解差異","table":[["面向","通用開發工具","Lovable 本次路徑"],["工作起點","既有目錄與檔案","平台新專案"],["執行環境","本機工具鏈","平台整合預覽"],["修改方式","提示、檔案與終端機","提示與平台流程"],["比較重點","需求、驗收與紀錄相同","技術環境差異另列"]],"widths":[230,430,476],"notes":{"time":"13:35–13:37，2 分鐘","talk":"通用工具可以在多種專案中工作，場景工具把特定開發流程整合在一起。兩者能力有重疊，不能只憑介面分類就推斷誰一定比較好。今天選 Web 開發作為共同任務。","action":"指出本機預覽與平台預覽的差異。本次 Lovable 新專案使用平台原生技術堆疊，本機為 React、TypeScript 與 Vite。","check":"學員理解比較的是整個工作流程，無法單獨歸因於模型。","transition":"接著看兩套 AI 工具如何完成相同任務。","sources":["S2","S6"]}},{"n":8,"title":"兩套 AI 工具的開發流程","kind":"columns","columns":[["Lovable","上傳議程附件、貼短提示","平台生成、開啟預覽","操作驗收，再提出修改"],["通用 AI（Codex App）","開啟 starter、貼相同提示","Agent 建置、開啟本機預覽","操作驗收，再提出修改"]],"bottom":"同一份資料與 UX 驗收標準，兩個版本的 UI 保持一致","notes":{"time":"13:37–13:39，2 分鐘","talk":"本課只比較 Lovable 與通用 AI 工具，講師以 Codex 桌面 App 示範。兩套各自從新專案開始，使用相同資料與短提示，先完成初版，再加入衝堂提示。90 分鐘內以實作、試用及驗收觀察差異；UI 由學員自由設計，但兩套工具要採相同設計。","action":"對照兩條流程，指出平台預覽與本機預覽。提醒學員：初版各 15 分鐘、修改各 5 分鐘，驗收也包含在內。","check":"確認學員知道今天只有兩套 AI 工具需要操作，兩個版本的 UI 保持一致，並依相同 UX 條件驗收。","transition":"現在把完成標準寫清楚。","sources":[]}},{"n":9,"title":"共同需求與完成標準","kind":"table","table":[["驗收","功能","要看到的結果"],["A1–A2","清單與搜尋","兩天 70 筆、日期清楚、可搜尋講者"],["A3","日期與主題篩選","條件同時生效，多標籤皆可查"],["A4–A5","收藏與我的議程","無重複、可取消、依時間排序"],["A6","儲存與手機版","重新整理保留、390px 可操作"]],"widths":[170,290,676],"bottom":"UI 由學員自訂，同一位學員的兩個版本保持一致","notes":{"time":"13:39–13:41，2 分鐘","talk":"我們固定資料與 UX 邏輯。UI 由各學員自行決定，同一位學員的兩個工具版本要採相同設計。所有議程兩天各 35 筆、共 70 筆；使用者能搜尋、用日期和主題一起篩選、收藏並保留即可。資料可能有多位講者與多個標籤，不能漏掉。","action":"快速指向 A1–A6 文件，確認學員找到表格。","check":"請一位學員說出 A3 的預期，例如 AI 搜尋加 Web 主題應為零筆。","transition":"接著定義如何計時。","sources":["S14"]}},{"n":10,"title":"實測規則","kind":"split","leftTitle":"初版","leftBig":"15 分鐘","leftText":"建置、等待、除錯、驗收\n全部計入本輪時間","rightTitle":"需求修改","rightBig":"5 分鐘","rightText":"修改與回歸檢查\n未完成就記錄截止狀態","bottom":"設定時間另計。沒有用量資料時填「未取得」","notes":{"time":"13:41–13:43，2 分鐘","talk":"設定與套件安裝另計。每輪從開始補充或送出該輪提示時起算，生成等待、除錯與驗收都算進去。到截止時沒通過就保留未完成狀態。不要把截止的十五分鐘寫成十五分鐘完成。","action":"展示紀錄表的狀態與通過 ID 欄位。說明除錯時間包含在經過時間內，不能再加總一次。","check":"確認學員能區分未取得、未測及零。","transition":"最後把規格整理成可貼給工具的提示。","sources":[]}},{"n":11,"title":"Lovable 初版 prompt","kind":"prompt","subtitle":"先上傳 hwdc-agenda-2026.json；附件位置與網址見下一頁","visibleText":["請用附件的 HWDC 議程做一個繁體中文「我的議程」網站：\n\n能搜尋議程或講者、依日期和主題篩選、加入或取消收藏，\n並查看自己的議程；重新整理後收藏要保留。\n\n搜尋與篩選可以一起用，日期時間要清楚，手機也能操作。\n資料照附件，保留來源。\n\n不用登入。做好後請開啟預覽，讓我試用。\n（UI 由學員自由發揮，但請讓兩個版本保持一致。）","先自訂 UI，再給兩套工具相同的設計要求"],"notes":{"time":"13:43–13:45，2 分鐘","talk":"人不需要先寫成工程規格才開始。上傳資料，講清楚想做什麼、用起來要怎樣，再讓 Agent 做出可試用的第一版。色彩、版型與字型由學員自訂，但 Lovable 與通用 AI 的兩個版本要保持一致。先用一句話描述自己的 UI 設計，再把相同設計要求交給兩套工具。驗收表拿在自己手上，發現缺漏再描述操作與預期。","action":"複製本頁提示，補上自己選定的 UI 設計要求，兩套工具使用相同描述。下一頁提供 JSON 附件位置與完整網址，先上傳再送出。","check":"學員知道 JSON 是附件，不需複製 70 筆資料；也知道自己可以選擇 UI，但兩個工具版本須一致。","transition":"先確認這份資料從哪裡來，以及要上傳哪個檔案。","sources":["S14"]},"prompt":"請用附件的 HWDC 議程做一個繁體中文「我的議程」網站：\n能搜尋議程或講者、依日期和主題篩選、加入或取消收藏，並查看自己的議程；重新整理後收藏要保留。\n搜尋與篩選可以一起用，日期時間要清楚，手機也能操作。資料照附件，保留來源。\n不用登入。做好後請開啟預覽，讓我試用。\n（UI 由學員自由發揮，但請讓兩個版本保持一致。）"},{"n":12,"title":"資料附件與來源","kind":"prompt","subtitle":"下載同一份 JSON，再上傳至 Lovable","visibleText":["HWDC 官方議程（公開來源）","https://hwdc.ithome.com.tw/2026/agenda","上傳附件：hwdc-agenda-2026.json","教材包位置：HWDC-workshop/materials/hwdc-agenda-2026.json","GitHub 附件（私人 repo，需存取權）","https://github.com/Wolke/hwdc-2026-ai-cli-vs-lovable/blob/main/\nHWDC-workshop/materials/hwdc-agenda-2026.json","兩天共 70 筆｜2026-10-13 快照｜兩套工具使用同一份"],"notes":{"time":"13:45–13:47，2 分鐘","talk":"官網議程是公開來源；我們把兩天 70 筆場次整理成固定 JSON 快照。投影片寫出來源及附件完整網址。目前 GitHub repo 為私人，學員可使用教材包 materials 裡的 JSON；沒有 repo 權限時不要卡在 GitHub 登入。提示與資料分開，上傳完再送出第 11 頁提示。","action":"示範從教材包選取 hwdc-agenda-2026.json 上傳，確認附件後貼第 11 頁提示。指出預覽入口並開始驗收。","check":"學員準備好送出提示及計時。","transition":"下一頁會固定顯示任務。","sources":["S2","S4","S14"]},"links":[{"label":"官方議程","url":"https://hwdc.ithome.com.tw/2026/agenda"},{"label":"JSON 附件（私人 repo，需存取權）","url":"https://github.com/Wolke/hwdc-2026-ai-cli-vs-lovable/blob/main/HWDC-workshop/materials/hwdc-agenda-2026.json"},{"label":"下載教材內的 JSON","url":"../materials/hwdc-agenda-2026.json"}]},{"n":13,"title":"實作 A：Lovable","kind":"task","big":"15:00","subtitle":"初版建置與驗收","items":["送出短提示與 HWDC 議程附件","操作 A1–A6，記下失敗項","保存耗時、追加提示及用量"],"bottom":"額度用完：向講師取得群組加入方式；仍卡關時使用離線版","notes":{"time":"13:47–14:03，1 分鐘說明加 15 分鐘實作","talk":"計時從 13:48 開始。大家要在這十五分鐘裡建置並操作六個驗收項目。畫面出現後就開始檢查，不要把最後一分鐘全部留給驗收。","action":"第 5 分鐘提醒查看預覽。第 10 分鐘提醒轉入驗收。最後 2 分鐘提醒保存紀錄。依現場狀況走動但不逐台長時間排障。 額度用完者先由講師私下提供群組加入方式；仍無法接續時依 2 分鐘規則切離線版。","check":"完成條件是可操作初版及 A1–A6 紀錄。截止未完成同樣保留觀察。","transition":"時間到後一起回報完成狀態。","sources":["S14"]}},{"n":14,"title":"初版驗收與紀錄","kind":"image","image":"02-search-and-filter.png","subtitle":"搜尋、日期與主題條件要一起成立","side":["搜尋林建宏","日期選 10/14","選相符主題：1 筆"],"imageCaption":"A3：改成 10/15 或不相符主題時，應為 0 筆","notes":{"time":"14:03–14:05，2 分鐘","talk":"搜尋林建宏，日期選 10/14，主題選 AI 開發工具實戰和流程改造，應只剩 4996。改成 SDLC 相關議題為零，改 10/15 也為零。另以陳宜昌的三個主題標籤檢查多標籤是否遺漏。","action":"依 A3 實際切換條件，不要求特定按鈕位置。","check":"條件是 AND；同一場的多個 tags 都能被找出。","transition":"接下來從空白起點使用通用工具。","sources":["S14"]}},{"n":15,"title":"Codex 桌面 App 操作","kind":"steps","items":[["選擇 Codex","開啟本次 starter 的獨立副本"],["指定資料檔，貼短提示","同一份 UX 任務，讓 Agent 決定畫面"],["查看修改與預覽","確認啟動方式、檔案差異及錯誤"]],"bottom":"本輪使用全新起點，不帶入 Lovable 產生的程式","notes":{"time":"14:05–14:06，1 分鐘","talk":"今天以 Codex 桌面 App 示範通用開發代理。開啟正確資料夾很重要，工具需要看到這次實驗的檔案。其他工具沿用相同需求與資料即可。","action":"桌面選 Codex，開啟獨立 starter 副本。指出專案路徑與檔案清單。官方介面更新時，以軟體開發及本機資料夾功能辨認。","check":"確認沒有學員直接把第一條路徑的程式交給第二條路徑。","transition":"下一頁直接列出可貼上的完整提示。","sources":["S6"]}},{"n":16,"title":"Codex 初版 prompt","kind":"prompt","subtitle":"開啟獨立 starter，直接貼上以下內容","visibleText":["資料檔：src/sessions.json（與 HWDC 議程附件相同）。","請用附件的 HWDC 議程做一個繁體中文「我的議程」網站：\n\n能搜尋議程或講者、依日期和主題篩選、加入或取消收藏，\n並查看自己的議程；重新整理後收藏要保留。\n\n搜尋與篩選可以一起用，日期時間要清楚，手機也能操作。\n資料照附件，保留來源。\n\n不用登入。做好後請開啟預覽，讓我試用。\n（UI 由學員自由發揮，但請讓兩個版本保持一致。）","資料與 UI 設計要求相同；完成後依 A1–A6 驗收"],"notes":{"time":"14:06–14:06:40，40 秒","talk":"這次直接貼本頁提示，資料位置寫在第一行。本機檔案與上傳 Lovable 的附件內容一致，UI 也採用自己在 Lovable 選定的相同設計。驗收表由人操作，發現問題再補充。","action":"複製本頁完整內容至 Codex，確認專案是獨立 starter。 加入與 Lovable 相同的 UI 設計描述。","check":"學員知道資料的位置及共同規格。","transition":"接著確認結果如何執行。","sources":["S14"]},"prompt":"資料檔：src/sessions.json（與 HWDC 議程附件相同）。\n\n請用附件的 HWDC 議程做一個繁體中文「我的議程」網站：\n能搜尋議程或講者、依日期和主題篩選、加入或取消收藏，並查看自己的議程；重新整理後收藏要保留。\n搜尋與篩選可以一起用，日期時間要清楚，手機也能操作。資料照附件，保留來源。\n不用登入。做好後請開啟預覽，讓我試用。\n（UI 由學員自由發揮，但請讓兩個版本保持一致。）"},{"n":17,"title":"執行與檢查","kind":"list","items":[["預覽有啟動","確認網址與終端機狀態"],["修改看得懂","知道改動哪些檔案及功能"],["結果有驗證","依 A1–A6 操作，記下仍有問題的項目"]],"bottom":"啟動失敗時，先保留原始錯誤訊息","notes":{"time":"14:06:40–14:07:20，40 秒","talk":"代理回覆已完成之後，仍需確認預覽真的可用。請看它改了哪些檔案，並保留錯誤原文。只有本機頁面開啟且驗收成立，才算對應功能完成。","action":"展示終端機及檔案差異入口。若預覽無法啟動，依兩分鐘備援規則繼續。","check":"學員知道如何找到錯誤資訊。","transition":"現在開始第二條路徑的計時。","sources":[]}},{"n":18,"title":"實作 B：通用 AI 工具","kind":"task","big":"15:00","subtitle":"從空白專案完成相同需求","items":["短提示＋相同 HWDC 議程資料","讓工具實作並啟動預覽","操作 A1–A6，記錄結果"],"bottom":"講師用 Codex App，你可以沿用已準備好的工具","notes":{"time":"14:07:20–14:23，40 秒說明加 15 分鐘實作","talk":"13:48 那一輪已經結束，請不要把未完成的工作混到這一輪。這次從 14:08 計時，依相同規格做一份新作品。","action":"14:08 開始，14:13 提醒看預覽，14:18 提醒驗收，14:21 提醒留紀錄，14:23 截止。","check":"完成條件是第二份可操作版本及六項紀錄。若使用備援，明示來源。","transition":"時間到，一起確認最容易漏掉的保存。","sources":["S14"]}},{"n":19,"title":"同標準驗收與紀錄","kind":"image","image":"03-my-schedule.png","subtitle":"重新整理後，收藏仍要保留","side":["收藏 4996、5030","切到我的議程","重新整理再確認"],"imageCaption":"參考解答示範 A4–A6。兩套工具使用同一張驗收表","notes":{"time":"14:23–14:25，2 分鐘","talk":"請確認我的議程只顯示收藏，排序正確，重新整理後仍在。保存是在同一瀏覽器與同一網址下比較。若埠號改變，瀏覽器會視為另一個來源。","action":"請學員記下本輪通過項目、時間及主要卡關原因，保留目前的收藏供下一輪檢查。","check":"兩條路徑都有可辨識的結果狀態。","transition":"現在需求要改變了。","sources":["S14"]}},{"n":20,"title":"新需求：收藏衝堂提示","kind":"image","image":"04-conflict-warning.png","subtitle":"使用者需要知道哪些收藏無法同時參加","side":["比較全部收藏","指出兩場與時段","由使用者自行決定"],"imageCaption":"第二版參考解答。提示不會自動移除收藏","notes":{"time":"14:25–14:25:20，20 秒","talk":"現在增加一個需求：讓使用者知道哪些收藏時間衝突。提醒要列出相關議程，但不自動取消任何收藏。","action":"展示第二版的衝堂區域，快速指出有兩場名稱與時段。","check":"學員理解修改的範圍。","transition":"先把邊界說清楚。","sources":["S14"]}},{"n":21,"title":"時間重疊案例","kind":"table","table":[["組合","時間關係（10/14）","預期"],["5030 + 5009","15:30–17:30／15:15–15:45","衝堂"],["4996 + 5018","13:00–15:00／13:30–14:00","衝堂"],["4996 + 4993","13:00–15:00／13:00–15:00","衝堂"],["4957 + 4958","10:00–10:10／10:10–10:55","不衝堂"]],"widths":[230,690,216],"bottom":"日期也要一起比較：4996（10/14）與 4992（10/15）不衝堂","notes":{"time":"14:25:20–14:25:40，20 秒","talk":"用真實場次練習邊界：5030 和 5009 部分重疊；4996 包含 5018；4996 和 4993 同時段；4957 結束 10:10 正好接 4958，因此不衝堂。再比 4996 和 4992，鐘點相同但日期不同，不能誤報。","action":"每次只收藏兩場，檢查完整日期時間。數學判斷式可放講義，不必要求大家把它寫進首輪提示。","check":"區分部分重疊、包含、相同、首尾相接與跨日。","transition":"最後補上修改時必須保留的行為。","sources":["S14"]}},{"n":22,"title":"修改 prompt：衝堂提醒","kind":"prompt","subtitle":"在自己的初版專案繼續，兩套工具使用相同提示","visibleText":["請在「我的議程」加上衝堂提醒，指出時間重疊的收藏，\n讓我自己決定要不要取消。\n\n要看全部收藏，不受搜尋或篩選影響；\n一場結束剛好接下一場不算衝堂，不同日期也不要混在一起。\n\n請保留原本的收藏和功能，取消收藏後立即更新提醒。\n完成後讓我試用。","送出前保留收藏；修改後檢查 B1–B6 與原有功能"],"notes":{"time":"14:25:40–14:26，20 秒","talk":"這個提醒要看全部收藏，不受目前搜尋與篩選影響。請維持原來的儲存鍵與格式，避免改完功能卻清掉收藏。","action":"直接複製本頁三句提示，在兩套工具各自的初版接續修改。","check":"學員準備好在各自的第一版繼續修改。","transition":"開始各五分鐘。","sources":["S14"]},"prompt":"請在「我的議程」加上衝堂提醒，指出時間重疊的收藏，讓我自己決定要不要取消。\n要看全部收藏，不受搜尋或篩選影響；一場結束剛好接下一場不算衝堂，不同日期也不要混在一起。\n請保留原本的收藏和功能，取消收藏後立即更新提醒。完成後讓我試用。"},{"n":23,"title":"兩套工具各修改一次","kind":"task","big":"5 + 5","subtitle":"每套工具 5 分鐘，包含修改與驗收","items":["先在 Lovable 修改","再在通用工具修改","兩份結果分別記錄"],"bottom":"到時保存狀態，14:36 開始共同回歸檢查","notes":{"time":"14:26–14:36，共 10 分鐘","talk":"先用五分鐘修改 Lovable，14:31 切換通用工具。兩條路徑各保留自己的提示與結果，不互相複製程式。若額度不足，先保留狀態並向講師取得群組加入方式。若改變實作環境，記錄切換前後的條件，確認仍是自己的初版專案及收藏；無法接續時使用備援版驗收。","action":"14:26 開始第一段，14:29 提醒驗收，14:31 切換，14:34 提醒驗收，14:36 截止。","check":"完成條件是 B1–B6 的結果紀錄。沒有測到的項目填未測。","transition":"一起檢查修改有沒有影響原功能。","sources":[]}},{"n":24,"title":"回歸檢查","kind":"image","image":"05-adjacent-no-conflict.png","subtitle":"新功能與原有功能都要成立","side":["首尾相接不提醒","取消收藏即時更新","A1–A6 仍通過"],"imageCaption":"4957 與 4958 於 10:10 相接，不誤報衝堂","notes":{"time":"14:36–14:40，4 分鐘","talk":"加入新功能後重做 A1–A6。特別確認第一版原有收藏沒有遺失，日期與多標籤篩選仍正確。此圖展示 4957 與 4958 相接沒有提示。","action":"保留約兩分鐘操作，再邀請兩位學員各用一句話分享：一個成功案例或一個預期與實際不符的地方。","check":"學生知道 AI 修改也可能破壞舊功能，紀錄可重現。","transition":"接著用紀錄討論效率。","sources":["S14"]}},{"n":25,"title":"上一輪彩排觀察","kind":"table","subtitle":"舊條件：長提示、12 筆合成資料、指定配色","table":[["AI 工具","初版含驗收","修改含回歸"],["Lovable","4 分 22 秒｜6/6","核心 3 分 33 秒\n手機於截止後補測"],["Codex App","1 分 55 秒｜6/6","1 分 3 秒｜6/6"]],"widths":[290,423,423],"bottom":"看過解答且交錯操作，非工具排名；新版短提示尚未重測","notes":{"time":"14:40–14:43，3 分鐘","talk":"這是上次長提示與 12 筆合成資料的操作彩排。兩套最後都完成。Codex 初版約 1 分 55 秒、修改約 1 分 3 秒；Lovable 初版約 4 分 22 秒、修改核心約 3 分 33 秒，精確手機尺寸在截止後補測。代理已看過解答，且第二輪交錯操作，不能據此排名。新版改用真實附件、短提示和自由 UI，必須另測。 詳細紀錄見 evidence/rehearsal-observations.md。","action":"先比較通過項目，再看時間與限制。補充 Lovable 衝堂區可直接取消，Codex 由卡片取消，示範 UX 路徑的差異。","check":"觀察時間不被解讀成普遍速度；沒有把舊成績當作新條件成績。","transition":"我們用一個可重現錯誤來看除錯工作。","sources":[]}},{"n":26,"title":"除錯 prompt：首尾相接","kind":"prompt","subtitle":"以下是刻意植入錯誤的教學案例","visibleText":["錯誤：a.start \u003c= b.end && b.start \u003c= a.end","修正：a.start \u003c b.end && b.start \u003c a.end","可直接貼上的除錯提示","我操作「＿＿」時，出現「＿＿」，但我預期是「＿＿」。\n\n請重現並修好，保留現有收藏與其他功能。修好後告訴我怎麼確認。\n\n（有錯誤訊息或畫面時，再附上。）","本例：收藏 4957、4958 卻提醒衝堂；預期首尾相接不提醒"],"notes":{"time":"14:43–14:45，2 分鐘","talk":"若沒有適合教學的實測錯誤，就用明確標示的刻意植入案例。把小於寫成小於等於會使 4957 與 4958 首尾相接被誤判。修正後，真正重疊仍應提醒，跨日不能混在一起。","action":"把範本中的操作填成收藏 4957、4958，實際填看到衝堂提示，預期填 10:10 首尾相接應不衝堂。送出後重做邊界驗收。","check":"學員能說出修正後要測的兩種結果。","transition":"接著把時間與費用放在一起看。","sources":[]},"prompt":"我操作「＿＿」時，出現「＿＿」，但我預期是「＿＿」。\n請重現並修好，保留現有收藏與其他功能。修好後告訴我怎麼確認。\n（有錯誤訊息或畫面時，再附上。）"},{"n":27,"title":"彩排用量與費用換算","kind":"table","subtitle":"2026/10/13 舊條件彩排，12 筆資料、長提示","table":[["階段","Lovable\n實耗／月費分攤","Codex\n總 tokens／Standard 估算"],["初版","2 credits\n約 US$0.98","343,319 tokens\n約 US$0.78"],["修改","3.10 credits\n約 US$1.52","410,956 tokens\n約 US$0.61"],["合計","5.10 credits\n約 US$2.50","754,275 tokens\n約 US$1.39"]],"widths":[170,456,510],"bottom":"美元為牌價換算，實際專案扣款未取得。\nCodex 速度模式未取得，無法據此判定誰較便宜。","links":[{"label":"Lovable 訂閱牌價","url":"https://docs.lovable.dev/introduction/subscription-plans"},{"label":"Codex 額度牌價","url":"https://learn.chatgpt.com/docs/pricing"},{"label":"Codex credit 美元面額假設","url":"https://developers.openai.com/community/students"},{"label":"token 明細、公式與費用證據","url":"../evidence/cost-check-20261013.html"}],"notes":{"time":"14:45–14:48，3 分鐘","talk":"本頁屬舊版 12 筆資料、長提示的彩排。Lovable 逐訊息實耗為初版 2 credits、修改 3.10，共 5.10。使用 Business 每月 1,200 credits 正常月費 US$588 全數分攤，單位 US$0.49，合計 US$2.499，約 US$2.50。此分攤未把每日附送點數或訂閱功能另外估值。工作區目前有全額訂閱優惠，當期訂閱帳單為 US$0，因此表中的金額不是專案實扣。若以 Business 加購 US$30／50 credits 換算，則為 US$3.06，兩個口徑不相加。Codex 在兩段實作時間窗共 743,895 輸入 tokens（其中 730,150 快取、13,745 未快取）及 10,380 輸出。依 GPT-6 Astra Standard 每百萬 tokens 的 250／25／1250 credits，換算 34.665 Codex credits。另採官方 2,500 credits 等值 US$100 的面額假設，得到約 US$1.39。這不是已核實的額度扣除或帳單。速度模式未記錄，若依加購額度的 Fast 2 倍／Ultrafast 6 倍試算，約 US$2.77／US$8.32。Codex 長對話及交錯操作使時間窗歸屬只能近似，和 Lovable 平台內訊息耗點的邊界不完全一致。這些結果不足以判定誰較便宜。人的主動工時與等待另外記錄，缺值不補零。","action":"先指認直接取得的用量，再指認換算假設。需要細節時，開啟教材 evidence/cost-check-20261013.html，展示兩張 Lovable 訊息耗點截圖、Codex token 明細與公式。提醒新條件的 70 筆議程比較仍待測。","check":"學員能區分實耗、正常訂閱分攤、Standard 情境估算與帳單實扣，不把不同平台 credits 當成相同單位，也不重複加總快取輸入或推理輸出。","transition":"除了這次用量，接著看修改範圍與後續接手會帶來什麼工作。","sources":["S3","S4","S7","S8","S15","S16","S17"]}},{"n":28,"title":"同一個 UX，一致的 UI","kind":"image","image":"06-mobile.png","portrait":true,"subtitle":"檢查兩個工具版本的設計一致，再試用核心任務","side":["找到想聽的議程","收藏後能找回來","衝堂看得懂、能處理","自訂 UI，兩個版本一致"],"imageCaption":"參考畫面非標準答案；390px 仍須可操作","notes":{"time":"14:48–14:50，2 分鐘","talk":"讓學員並排檢查自己的 Lovable 與通用 AI 作品，確認配色、版型與導覽採用同一份設計，再展示找到議程、收藏、看衝堂、決定取消或保留的流程。各學員可選不同風格，同一位學員的兩個工具版本要保持一致。若有差異，記錄工具是否遵循設計要求，以及修正所需的提示與時間。","action":"邀請鄰座互相試用 60 秒，再用 60 秒分享兩個版本的完成度與 UI 一致性；不投票選工具冠軍。","check":"兩套工具使用相同的 UI 設計要求，且使用者找得到完成任務的下一步。","transition":"把這些觀察帶回自己的工作情境。","sources":["S2","S5","S14"]}},{"n":29,"title":"情境選型表","kind":"table","subtitle":"先確定工作條件，再選擇起手方式","table":[["情境","先檢查的條件","選型方向"],["快速驗證新想法","預覽速度、流程契合、額度","評估場景工具"],["修改既有專案","檔案、工具鏈、測試與權限","評估通用工具"],["持續迭代與交接","回歸、程式碼、知識與成本","依紀錄調整組合"]],"widths":[310,490,336],"bottom":"此表是決策框架，個別專案仍需驗證","notes":{"time":"14:50–14:52，2 分鐘","talk":"選型從工作條件開始。要快速驗證新 Web 想法時，看看場景整合能節省哪些步驟。既有專案則先確認工具能否處理現有檔案與測試。持續維護需要累積更多紀錄，再調整組合。","action":"請學員寫下下一個真實專案及最重要的驗收條件。","check":"學員給的理由能連結到本次觀察，不只說偏好某個品牌。","transition":"用 PDCA 把這種選擇變成可以重複的流程。","sources":[]}},{"n":30,"title":"PDCA 與專案知識管理","kind":"list","items":[["Plan　留下規格與完成標準","需求、資料、限制與驗收案例"],["Do／Check　保留程式與驗證","實際執行、紀錄錯誤、檢查回歸"],["Act　依結果調整下一輪","修改範圍、提示、工具與模型投入"]],"bottom":"工具換了，需求與驗收紀錄仍能沿用","notes":{"time":"14:52–14:54，2 分鐘","talk":"把今天做過的事情連回 PDCA。Plan 是我們固定的需求與資料，Do 是建置，Check 是驗收，Act 是修改方式與下一輪的選擇。模型能力的調整也應根據任務難度與驗收結果，不能只看單次價格。","action":"指出專案中需求、紀錄及錯誤重現三類文件。請學員保留一個下一輪要改善的點。","check":"學員知道如何把一次體驗變成可重複流程。","transition":"最後看教材裡能接著練什麼。","sources":[]}},{"n":31,"title":"課後延伸與教材導覽","kind":"list","items":[["學員講義與提示","可直接沿用到下一個專案"],["兩版參考解答","比對 UX 邏輯，不要求畫面長一樣"],["行事曆匯出練習","將收藏輸出為 .ics 並驗證時間"]],"bottom":"保留自己的實驗紀錄，再打開參考答案","notes":{"time":"14:54–14:55，1 分鐘","talk":"講義整理了今天的步驟與提示，兩版解答供課後比對。完成者可練習行事曆匯出，注意時區及中文文字。先保留自己的紀錄，才能看出自己在哪一步需要改善。","action":"展示教材資料夾及 extension-ics.md 的位置。","check":"學員知道離線版本、講義和參考答案的位置。","transition":"最後五分鐘開放問題。","sources":[]}},{"n":32,"title":"Q&A","kind":"question","big":"你的下一個專案\n會先用哪套工具？","subtitle":"請用一個驗收條件，說明你的選擇","notes":{"time":"14:55–15:00，5 分鐘","talk":"歡迎分享今天遇到的需求理解、修改或驗收問題。也可以把下一個專案的條件說出來，我們一起檢查選型理由。","action":"優先回覆能讓全場受益的問題。個別安裝問題留待課後。時間充裕時可選第 39–43 頁，否則直接跳第 44 頁讓學員訂閱系列；瀏覽器版可點「訂閱 QR」。15:00 準時結束。","check":"學員至少能說出一個條件與相對應的觀察。","transition":"謝謝大家，最後附上兩個系列的訂閱 QR Code，歡迎課後繼續練習。","sources":[]},"bottom":"有時間可選講：39–43 頁　／　系列訂閱 QR Code：44 頁"},{"n":33,"title":"Codex CLI 對應操作","kind":"code","subtitle":"附錄：已完成安裝與登入時","code":"cd 你的專案資料夾\ncodex\n\n/status","items":["同樣引用需求、資料與驗收文件","/status 查看可取得的用量狀態","詳細安裝方式依官方文件"],"notes":{"time":"附錄，視問題使用","talk":"桌面 App 與 CLI 都可在專案上下文中工作。這裡示範最少的對應操作，不要求全場臨時換介面。CLI 需要先完成安裝和登入，設定與可用功能仍應記錄。","action":"在準備好的專案資料夾啟動 codex，引用相同檔案。需要查看額度時用 /status。","check":"學員知道 CLI 是另一個操作入口，並非本課額外必裝工具。","transition":"回到實作或 Q&A。","sources":["S8","S9"]}},{"n":34,"title":"macOS／Windows 環境檢查","kind":"code","subtitle":"附錄：在含 package.json 的資料夾執行","code":"node --version\nnpm --version\nnpm ci\nnpm run dev","items":["macOS：終端機進入專案目錄","Windows：在資料夾開啟終端機","採 Node.js 24，預先安裝套件"],"notes":{"time":"附錄，準備時段使用","talk":"第一次 npm ci 需要網路。請讀取錯誤原文，不要盲目重試。版本不符先完成環境或改用備援，本課不安排逐台重裝。","action":"指向套件安裝及本機網址，說明埠號已使用時工具可能改用其他埠。","check":"學員能分辨資料夾錯誤、版本錯誤與套件下載失敗。","transition":"兩分鐘無法接續時切備援。","sources":[]}},{"n":35,"title":"額度、網路與啟動問題","kind":"table","table":[["狀況","先留下的紀錄","接續方式"],["Lovable 額度用完","餘額、未完成項目","掃右側 QR 申請\n填完向講師示意"],["服務無回應","當下畫面、時間","換本機參考版"],["本機啟動失敗","指令、錯誤原文","2 分鐘後切備援"],["收藏沒有保留","網址、埠號、儲存警告","確認同一來源"]],"widths":[210,250,290],"notes":{"time":"附錄，現場排錯使用","talk":"Lovable 額度已用完時，直接掃本頁右側 QR Code，填登入 Lovable 的 email，再向講師示意。講師查看表單回覆後另行安排群組邀請，學員完成信件中的邀請步驟。表單不會自動加入。仍無法建置或遇服務中斷時，改用離線參考版並保留切換原因。","action":"本頁即可展示 QR，不必離開排錯附錄。需要較大的 QR Code 時切到第 3 頁。邀請或排錯無法立即完成者，先做 offline/reference-v1.html 的驗收。","check":"學員知道如何維持進度與紀錄來源。","transition":"回到下一個教學步驟。","sources":["S18"]},"bottom":"群組加入後仍無法建置時，使用離線參考版驗收","qrImage":"../materials/qr/lovable-group-application.png","links":[{"label":"Lovable 群組加入申請","url":"https://forms.gle/pt3nLWy622sYTfsG6"},{"label":"前往第 3 頁 QR Code","url":"index.html#3"}]},{"n":36,"title":"延伸 prompt：匯出行事曆","kind":"prompt","subtitle":"選做練習，不占正式課程的 15／5 分鐘比較","visibleText":["請讓我把全部收藏下載成 .ics 行事曆檔，不受搜尋或篩選影響，\n匯入後要有正確的議程名稱、日期時間與會議室。\n\n請保留原有收藏與功能，沒有收藏時提示我先收藏。\n完成後給我檔案，並說明怎麼驗證匯入結果。","檢查：兩場都匯入、日期時間與中文正確、原功能仍可用","格式參考：https://www.rfc-editor.org/rfc/rfc5545"],"notes":{"time":"附錄，課後延伸","talk":"先用這兩句人話描述想要的結果。實際 .ics 格式的欄位、跳脫、換行與時區，放在講義驗收及參考實作。匯入自己的行事曆軟體確認，不只相信文字回覆。","action":"複製本頁提示進行課後練習。檢查 4996 台北 13:00 對應 05:00 UTC，5030 台北 15:30 對應 07:30 UTC。","check":"學員能說出至少一個畫面以外的驗收問題，例如 UTC 換算。","transition":"回到教材導覽。","sources":["S10"]},"prompt":"請讓我把全部收藏下載成 .ics 行事曆檔，不受搜尋或篩選影響，匯入後要有正確的議程名稱、日期時間與會議室。\n請保留原有收藏與功能，沒有收藏時提示我先收藏。完成後給我檔案，並說明怎麼驗證匯入結果。"},{"n":37,"title":"完整實測紀錄表","kind":"table","subtitle":"附錄：可直接複製 measurement-template.md","table":[["分類","必填內容","缺資料時"],["條件","工具、模型、方案、版本、起始狀態","未取得／未揭露"],["結果","時間、通過 ID、完成或截止狀態","未測"],["投入","追加提示、主動工時、等待、用量","未取得"],["證據","提示、截圖、程式、錯誤與修正","明確記錄原因"]],"widths":[180,730,226],"notes":{"time":"附錄，填表時使用","talk":"有用的紀錄要能追溯條件。請寫驗收 ID，而不是只有感想。未取得、未測與零有不同意義：沒有查到用量不能填零，没有測功能不能填通過。 使用講師提供群組時，記下額度來源與切換時間。看不到個人用量時標示未取得。","action":"開啟完整範本，示範如何記下截止未完成及用量未知。","check":"學員能依自己的資料填表，不虛構缺值。","transition":"需要更新簡報時，從這份紀錄取數。","sources":[]}},{"n":38,"title":"資料與官方參考網址","kind":"prompt","subtitle":"查核日期：2026-10-13；JSON 附件完整網址見第 12 頁","visibleText":["HWDC 議程","https://hwdc.ithome.com.tw/2026/agenda","Lovable 技術","https://docs.lovable.dev/introduction/faq","Lovable 額度","https://docs.lovable.dev/introduction/credits-and-usage","Codex 桌面","https://learn.chatgpt.com/docs/quickstart","Codex 登入／計費","https://learn.chatgpt.com/docs/auth","行事曆格式","https://www.rfc-editor.org/rfc/rfc5545"],"notes":{"time":"附錄，供查閱","talk":"議程附件是官網公開快照，70 筆場次與 12 筆休息原始資料分開保存。來源、擷取日期、台北時區正規化有紀錄，開課兩套工具使用同一份。主辦資訊以官網為準。","action":"直接點選本頁官方網址，附件則看第 12 頁；完整來源記錄仍保留於 sources.md。","check":"來源與限制可辨識。","transition":"結束。","sources":["S1","S2","S3","S4","S5","S6","S7","S8","S9","S10","S11","S12","S13","S14"]},"links":[{"label":"HWDC 議程","url":"https://hwdc.ithome.com.tw/2026/agenda"},{"label":"Lovable 技術","url":"https://docs.lovable.dev/introduction/faq"},{"label":"Lovable 額度","url":"https://docs.lovable.dev/introduction/credits-and-usage"},{"label":"Codex 桌面","url":"https://learn.chatgpt.com/docs/quickstart"},{"label":"Codex 登入／計費","url":"https://learn.chatgpt.com/docs/auth"},{"label":"行事曆格式","url":"https://www.rfc-editor.org/rfc/rfc5545"}]},{"n":39,"title":"費用估算與比較範圍","kind":"table","subtitle":"選講補充：這組換算假設下，Codex 的美元估值較低","table":[["工具","記錄到的用量","美元換算"],["Lovable","5.10 credits","約 US$2.50\n正常訂閱分攤"],["Codex","754,275 tokens","約 US$1.39\nStandard 額度面額估算"]],"links":[{"label":"完整費用證據與假設","url":"../evidence/cost-check-20261013.html"},{"label":"OpenAI 費用口徑","url":"https://learn.chatgpt.com/docs/pricing"}],"notes":{"time":"選講，約 2 分鐘","talk":"這組換算假設下，看起來 Codex 的美元估值較低。Lovable 是實際消耗 5.10 credits，再用正常訂閱月費分攤成約 2.50 美元。Codex 的 754,275 tokens 採 Astra Standard 額度率與每 credit 0.04 美元的面額假設，得到約 1.39 美元。兩邊都不是已核實的專案扣款。尤其 Codex 實際速度模式未取得，以加購額度 Fast／Ultrafast 試算會變成約 2.77／8.32 美元，因此不能說所有情況 Codex 都比較便宜。這是舊版 12 筆資料、長提示彩排，完成度及返工觀察一起看。今天落地的場景是網站開發，這也是通用 coding agent 的常見任務，換場景仍需實測。","action":"先比較表中兩種美元口徑，再指明速度模式缺值。若學員想看計算，回到第 27 頁或開啟費用證據。","check":"學員知道估值大小取決於換算假設，也能區分實際用量、估算與帳單。","transition":"這也是我原本想用 Roblox Studio AI 作比較的原因。","sources":["S8","S15","S16","S17"]}},{"n":40,"title":"原投稿題目：Roblox Studio AI","kind":"list","subtitle":"網站開發是通用 coding agent 的常見任務，換場景仍要重測","items":[["原先規劃","Roblox Studio AI 與通用 AI 的開發比較"],["當時採用的流程","需自備 API key 與用量預算"],["改題的經過","主辦單位洽詢後未取得贊助，最後改用 Lovable"]],"links":[{"label":"Roblox 系列","url":"https://ithelp.ithome.com.tw/users/20046160/ironman/9450"},{"label":"講師提供的投稿經過","url":"../materials/bonus-content.html"}],"notes":{"time":"選講，約 2–3 分鐘","talk":"這段是我的投稿經驗。原本想比較 Roblox Studio AI，因為寫 Luau 程式以外，還有場景物件、資產及編輯器狀態，工具整合可能造成很不一樣的效果與費用。但當時預計採用的流程需要參與者提供自己的 API key 與用量預算，主辦單位去問過贊助，最後沒有取得，才改成 Lovable。這只是在說當時規劃的操作方式，不是所有 Roblox AI 功能的通則。我們今天沒有 Roblox 實測數字，因此把它當成下一個比較課題。各位可以沿用相同需求、相同驗收、限時建置、一次修改與回歸檢查的框架，再記下完成度、時間、用量和人的投入。","action":"用自身經驗說明選題與課堂成本的限制。提出 Roblox 的 Luau、場景／資產及 Playtest 為可測任務，邀請學員課後選一個專用工具重測。","check":"學員理解本堂 Web 結果的適用邊界，不把尚未測量的 Roblox 案例當成排名或數據。","transition":"回到 Lovable，它的價值還包含網站完成後的發布與整合。","sources":["S25","S27"]}},{"n":41,"title":"Lovable 的發布與網域","kind":"list","subtitle":"平台提供網站託管，可以直接把作品分享出去","items":[["Publish 對外發布","取得可分享的 lovable.app 網址"],["修改後再次發布","點 Publish changes，讓正式站更新"],["自有網域","付費方案可連接自己購買的網域"]],"links":[{"label":"系列第 17 篇：發布、網域與正式上線","url":"https://ithelp.ithome.com.tw/articles/10406635"},{"label":"官方 Publishing","url":"https://docs.lovable.dev/features/publish"}],"notes":{"time":"選講，約 2 分鐘","talk":"Lovable 做好作品後，可以直接發布到平台提供的 lovable.app 網址。畫面上的 project-name 只是格式示意，沒有替大家建立新網站。平台提供託管，因此課堂原型可以很快分享。要分清楚編輯中的預覽和正式站，後來改完程式碼還要再次發布，正式站才會更新。付費方案可以連接自己購買的網域。發布後仍要開正式網址，測一次登入、資料與核心操作。","action":"指認範例網域、發布及再次發布。時間充裕可開系列第 17 篇看發布流程；示範僅查看設定，依講師既有專案狀態決定是否發布。","check":"學員能說出預覽、發布與再次更新的差別，知道自有網域是選項。","transition":"能快速發布，是因為平台已整合許多原本需要自己接起來的工具。","sources":["S21","S22","S24"]}},{"n":42,"title":"Lovable 整合好的開發工具","kind":"table","subtitle":"比較平台價值時，也記錄省下多少設定與整合工時","table":[["工具／階段","在同一套流程裡完成的工作"],["Plan／Build","先討論規劃，再讓 Agent 實作"],["Lovable Cloud","資料庫、登入、檔案儲存與後端函式"],["測試與安全檢查","工具協助檢查，發布前仍需親自驗收"],["GitHub 與發布","同步程式碼、查看預覽與發布正式站"]],"links":[{"label":"系列第 1 篇：Lovable 到底強在哪裡","url":"https://ithelp.ithome.com.tw/articles/10406618"},{"label":"官方 Lovable Cloud","url":"https://docs.lovable.dev/features/cloud"}],"notes":{"time":"選講，約 2 分鐘","talk":"依我的系列第一篇，Lovable 的重點是把需求討論、開發、後端資源、檢查與發布串成完整流程。Plan 用來先討論需求與安排工作，Build 再讓 Agent 修改專案。Cloud 提供資料庫、登入、儲存和後端函式。測試與安全工具幫忙檢查，但使用者仍要驗收核心流程。GitHub 同步程式碼，可以接續版本管理。因此平台費用不能只看每次生成用了多少 token，也要觀察自己省下多少設定與整合工時。Cloud、AI 及第三方服務的用量依方案分開核對，不假設都包含或無上限。","action":"用收藏器延伸「加會員登入、上傳檔案、保存雲端資料」的例子，讓學員說明哪部分可能省去整合工作。這些不加入今天的必做需求。","check":"學員知道生成程式碼以外的平台工作，也理解發布前驗收仍由自己負責。","transition":"需要其他公司的資料與功能時，就會用到 connectors。","sources":["S19","S24","S5"]}},{"n":43,"title":"第三方服務與 connectors","kind":"table","subtitle":"Notion、Google Workspace、Slack、Resend 等服務","table":[["類型","帳號與使用時機"],["App + chat","共用連線，供成品 App 與建置對話使用"],["Chat（MCP）","個人建置上下文，不隨成品部署"],["App user","每位 App 使用者登入自己的帳號並授權"]],"links":[{"label":"系列第 11 篇：第三方整合","url":"https://ithelp.ithome.com.tw/articles/10406629"},{"label":"官方 Connectors 類型","url":"https://docs.lovable.dev/integrations/introduction"}],"notes":{"time":"選講，約 2 分鐘","talk":"Lovable 已整合許多其他公司的服務，例如 Notion、Google Workspace、Slack 和 Resend。依現在的官方文件，連線有不同用途。App + chat 是共用連線，能供成品執行時或建置對話使用。Chat connector，也就是 MCP，是個人在建置時參考的上下文，不會隨成品部署。App user 則是每位使用者登入自己的第三方帳號授權。不是每個服務都支援全部類型。Connector 降低整合工作，但仍然需要帳號授權、正確權限及費用確認。像 Resend 的郵件寄送，就要連接自己的服務帳號，使用量依第三方方案核對。","action":"以「建置時讀 Notion 需求文件」與「成品 App 寫入 Notion」兩個例子對照。邀請學員判斷需要的連線類型，不在現場授權真實帳號或寄送訊息。","check":"學員能區分建置上下文與成品功能，並知道共用帳號和每位使用者授權不同。","transition":"這些操作在系列裡都有延伸說明，最後歡迎掃碼訂閱。","sources":["S20","S23"]}},{"n":44,"title":"課後延伸：兩個實作系列","kind":"qr","subtitle":"掃碼開啟系列，登入 iT 邦幫忙後點「訂閱系列文」","links":[{"label":"Roblox Studio AI 協作開發大全","url":"https://ithelp.ithome.com.tw/users/20046160/ironman/9450"},{"label":"Lovable：地球上最強的 AI 生成全端網站 Agentic 開發實戰","url":"https://ithelp.ithome.com.tw/users/20046160/ironman/9449"}],"notes":{"time":"結尾，約 1 分鐘；可從第 32 頁直接跳入","talk":"左邊是 Roblox Studio AI 協作開發大全，右邊是 Lovable：地球上最強的 AI 生成全端網站 Agentic 開發實戰。掃碼後會開啟各系列頁，登入 iT 邦幫忙後可以點訂閱系列文。歡迎沿用今天的框架，拿你在意的任務去試其他工具，留下自己的觀察。","action":"停留約 45–60 秒讓學員掃碼。若沒有選講時間，Q&A 結束後直接跳這頁。網址亦可點選，另有教材中的 QR 展示頁與 PNG／SVG。","check":"後排能掃描；學員知道掃碼開啟系列頁後，仍需自行點選訂閱。","transition":"謝謝大家，歡迎課後交流實作心得。","sources":["S25","S26"]}}];let current=Math.min(slides.length,Math.max(1,Number(location.hash.slice(1))||4));const img=document.querySelector('#slide'),select=document.querySelector('#select'),notes=document.querySelector('#notes');function show(){const s=slides[current-1];img.src=String(current).padStart(2,'0')+'.png';img.alt=s.title;select.value=current;document.querySelector('#count').textContent=current+' / '+slides.length;notes.textContent='時間：'+s.notes.time+'\n\n講述：'+s.notes.talk+'\n\n操作：'+s.notes.action+'\n\n檢核：'+s.notes.check+'\n\n轉場：'+s.notes.transition;history.replaceState(null,'','#'+current);const extras=document.querySelector('#extras');extras.replaceChildren();if(s.prompt){const label=document.createElement('h2');label.textContent='可直接複製的 prompt';const pre=document.createElement('pre');pre.textContent=s.prompt;extras.append(label,pre);}if(s.links){const label=document.createElement('h2');label.textContent='資料與參考網址';extras.append(label);for(const link of s.links){const row=document.createElement('p'),a=document.createElement('a');a.href=link.url;a.textContent=link.label+'：'+link.url;row.append(a);extras.append(row);}}document.querySelector('#extras-toggle').disabled=!s.prompt&&!s.links;}window.addEventListener('hashchange',()=>{current=Math.min(slides.length,Math.max(1,Number(location.hash.slice(1))||4));show();});document.querySelector('#prev').onclick=()=>{current=Math.max(1,current-1);show();};document.querySelector('#next').onclick=()=>{current=Math.min(slides.length,current+1);show();};select.onchange=()=>{current=Number(select.value);show();};document.querySelector('#toggle').onclick=()=>notes.hidden=!notes.hidden;document.querySelector('#extras-toggle').onclick=()=>{const extras=document.querySelector('#extras');extras.hidden=!extras.hidden;if(!extras.hidden)extras.scrollIntoView({behavior:'smooth'});};document.querySelector('#bonus').onclick=()=>{current=39;show();};document.querySelector('#subscriptions').onclick=()=>{current=44;show();};document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();current=Math.min(slides.length,current+1);show();}if(e.key==='ArrowLeft'){current=Math.max(1,current-1);show();}if(e.key.toLowerCase()==='n')notes.hidden=!notes.hidden;});show();</script></body></html>
