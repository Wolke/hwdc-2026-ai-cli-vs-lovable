<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HWDC 投影片預覽</title><style>body{margin:0;background:#14243a;color:white;font:16px/1.7 system-ui,"PingFang TC",sans-serif}header{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#bfd9ff}button,select{font:inherit;padding:6px 12px;border:0;border-radius:4px;cursor:pointer}figure{margin:0 auto;width:min(100vw,calc((100vh - 80px)*16/9));}img{display:block;width:100%}#notes{max-width:1100px;margin:20px auto;padding:24px;background:#fff;color:#17283e;white-space:pre-wrap}#notes[hidden]{display:none}@media print{header,#notes{display:none}body{background:white}figure{width:100%}}</style></head><body><header><a href="../../開始這裡.html">教材首頁</a><div><button id="prev">上一頁</button> <select id="select" aria-label="投影片頁碼"><option value="1">1　入場準備</option><option value="2">2　教材與起始專案</option><option value="3">3　額度與求助方式</option><option value="4">4　通用 AI CLI vs. 場景專用 AI</option><option value="5">5　今天的成品</option><option value="6">6　學習目標與流程</option><option value="7">7　通用與場景專用工具</option><option value="8">8　三種開發流程</option><option value="9">9　共同需求與完成標準</option><option value="10">10　實測規則</option><option value="11">11　短提示，先讓作品跑起來</option><option value="12">12　Lovable 操作示範</option><option value="13">13　實作 A：Lovable</option><option value="14">14　初版驗收與紀錄</option><option value="15">15　Codex 桌面 App 操作</option><option value="16">16　專案上下文</option><option value="17">17　執行與檢查</option><option value="18">18　實作 B：通用 AI 工具</option><option value="19">19　同標準驗收與紀錄</option><option value="20">20　新需求：收藏衝堂提示</option><option value="21">21　時間重疊案例</option><option value="22">22　修改也用簡單的話</option><option value="23">23　兩套工具各修改一次</option><option value="24">24　回歸檢查</option><option value="25">25　上一輪彩排觀察</option><option value="26">26　除錯案例：首尾相接</option><option value="27">27　費用與開發工時</option><option value="28">28　同一個 UX，不同的 UI</option><option value="29">29　情境選型表</option><option value="30">30　PDCA 與專案知識管理</option><option value="31">31　課後延伸與教材導覽</option><option value="32">32　Q&A</option><option value="33">33　Codex CLI 對應操作</option><option value="34">34　macOS／Windows 環境檢查</option><option value="35">35　額度、網路與啟動問題</option><option value="36">36　進階練習：匯出行事曆</option><option value="37">37　完整實測紀錄表</option><option value="38">38　來源、版本與查核日期</option></select> <button id="next">下一頁</button> <button id="toggle">講者備註</button> <button id="full">全螢幕</button></div><span id="count"></span></header><figure><img id="slide" alt=""></figure><section id="notes" hidden></section><script>const slides=[{"n":1,"title":"入場準備","kind":"list","subtitle":"13:00–13:30　環境準備時間","items":[["帳號已登入","Lovable，以及你慣用的通用 AI 工具"],["電腦能執行專案","Node.js、npm、瀏覽器與穩定網路"],["教材已解壓","先開啟學員講義，再準備空白專案"]],"notes":{"time":"準備時段，約 10 分鐘循環顯示","talk":"歡迎各位。請先確認帳號可以使用，不要急著送出建置需求。今天會比較兩條路徑，請先保留 Lovable 的可用額度。 如果今天的 5 點已經用完，請先向我示意，我會私下提供群組加入方式。","action":"打開學員講義的環境準備。請已完成的人協助鄰座。","check":"學員能指出自己的工具、帳號與教材所在位置。","transition":"接著確認本機起始專案。","sources":["S1"]}},{"n":2,"title":"教材與起始專案","kind":"steps","subtitle":"先把空白頁跑起來","items":[["解壓 starter","空白工具鏈與 70 筆 HWDC 公開議程"],["npm ci","第一次安裝需要網路"],["npm run dev","開啟終端機顯示的本機網址"]],"bottom":"看到「環境已就緒」後，保留這份空白起點","notes":{"time":"準備時段，約 10 分鐘","talk":"起始專案尚未實作搜尋、收藏或衝堂提示。請先不要打開參考解答。設定及安裝時間會另外記錄，正式建置才開始 15 分鐘計時。","action":"在 starter 終端機示範兩個指令，指出需要停留在有 package.json 的資料夾。","check":"學員能看到空白頁，知道本機網址。","transition":"最後確認額度與卡關時的接續方法。","sources":["S14"]}},{"n":3,"title":"額度與求助方式","kind":"split","subtitle":"先看餘額，再開始實作","leftTitle":"Lovable 免費建置額度","leftBig":"5 點／日","leftText":"另有每月 30 點上限\n每次建置耗點依任務而異","rightTitle":"今天的 5 點已用完？","rightItems":["請先向講師示意","講師私下提供群組加入方式","加入後確認可繼續實作"],"notes":{"time":"準備時段，約 10 分鐘","talk":"免費建置額度不是固定五次提示。如果今天的 5 點已用完，或可用額度不足，請向我示意，我會私下提供群組加入方式。加入後依現場安排確認是否能繼續實作。若仍無法建置，保留當下狀態，使用離線版完成驗收練習。","action":"查看帳號餘額。由講師私下提供邀請並協助加入群組，確認實作入口可用。群組加入屬環境準備，另外記錄設定時間。指出離線版本作為下一層備援。","check":"每人知道自己的額度來源。額度用完者能向講師取得群組加入方式；仍無法實作者知道離線檔案位置。","transition":"13:30 開始正式課程。","sources":["S3","S4"]},"bottom":"若仍無法建置或卡關超過 2 分鐘，保留紀錄後使用離線版"},{"n":4,"title":"通用 AI CLI vs. 場景專用 AI","kind":"cover","subtitle":"以 Lovable Web 開發為例的效能實測","author":"林建宏 Wolke Lin","event":"HWDC 2026　10/14　13:30–15:00","notes":{"time":"13:30–13:31，1 分鐘","talk":"我是林建宏 Wolke。我把自己定位為一名啟發者，透過分享開發經驗，幫助大家理解問題並動手實作。我是 Google Developer Expert、LINE Expert，也是技術書作者，持續分享 AI 人機協作、提示工程與程式開發。今天用同一份 Web 需求，親自觀察兩種工具的建置、修改與驗收。","action":"約 30 秒介紹背景，指出 Medium 文章與著作。接著說明本次以 Codex 桌面 App 示範通用工具，CLI 操作放在附錄。","check":"確認全場能看清投影字體。","transition":"先看看今天要完成的作品。","sources":["S1","S11","S12","S13"]},"credentials":"Google Developer Expert　／　LINE Expert","expertise":"AI 人機協作與程式開發教學　／　技術書作者","medium":"medium.com/@wolkesau"},{"n":5,"title":"今天的成品","kind":"image","image":"01-v1-desktop.png","subtitle":"研討會議程收藏器","imageCaption":"真實議程參考解答，UI 只是其中一種可能","side":["查詢議程","收藏並保留","第二輪加入衝堂提示"],"notes":{"time":"13:31–13:33，2 分鐘","talk":"展示採真實議程附件的參考版。今天要完成的是找議程、收藏、重新整理後保留，再加上衝堂提示。這張畫面只是其中一種 UI，不要求學員模仿。","action":"現場開啟離線參考版，搜尋林建宏，收藏 4996、5030，重新整理，確認收藏仍在。切第二版加入 5018 看提醒。","check":"請學員說出畫面可見但尚未證明的功能，例如重新整理保存。","transition":"接下來說明今天要留下什麼。","sources":["S14"]}},{"n":6,"title":"學習目標與流程","kind":"list","subtitle":"每一步都留下可檢查的成果","items":[["兩個初版","同一份真實附件、UX 一致，UI 自由"],["一次需求變更","兩套工具各修改，再做回歸檢查"],["一份選型理由","根據完成度、時間與用量說明選擇"]],"bottom":"最後互相試用：相同任務，不同介面","notes":{"time":"13:33–13:35，2 分鐘","talk":"請舉手讓我知道大家主要使用哪套工具。你可以沿用自己熟悉的工具，只要使用相同需求及資料，並記下條件。今天希望每個人都能留下可操作作品和自己的觀察。","action":"快速詢問工具分布。指出兩段 15 分鐘建置與各 5 分鐘修改。","check":"確認學員知道可以自選通用工具，不必現場換裝。","transition":"先看兩類工具在工作流程中的差別。","sources":[]}},{"n":7,"title":"通用與場景專用工具","kind":"table","subtitle":"以工作範圍與整合方式理解差異","table":[["面向","通用開發工具","Lovable 本次路徑"],["工作起點","既有目錄與檔案","平台新專案"],["執行環境","本機工具鏈","平台整合預覽"],["修改方式","提示、檔案與終端機","提示與平台流程"],["比較重點","需求、驗收與紀錄相同","技術環境差異另列"]],"widths":[230,430,476],"notes":{"time":"13:35–13:37，2 分鐘","talk":"通用工具可以在多種專案中工作，場景工具把特定開發流程整合在一起。兩者能力有重疊，不能只憑介面分類就推斷誰一定比較好。今天選 Web 開發作為共同任務。","action":"指出本機預覽與平台預覽的差異。本次 Lovable 新專案使用平台原生技術堆疊，本機為 React、TypeScript 與 Vite。","check":"學員理解比較的是整個工作流程，無法單獨歸因於模型。","transition":"把傳統開發也放進同一個流程來看。","sources":["S2","S6"]}},{"n":8,"title":"三種開發流程","kind":"columns","columns":[["手工開發","自行拆解與實作","查文件、執行、除錯","由講師課前計時"],["Lovable","描述需求與資料","平台建置及預覽","檢查後提出修改"],["Codex App","開啟本機專案","代理修改並執行","查看差異與驗收"]],"bottom":"三條路徑都需要人確認「完成」","notes":{"time":"13:37–13:39，2 分鐘","talk":"AI 改變產生程式的方式，但需求確認與成果驗收仍需人負責。手工開發用同一份空白專案，允許查官方文件並關閉 AI 補全。手工及兩套 AI 的獨立計時紀錄若未取得，就會明示。","action":"指出一段等待生成的時間與一段人工檢查的時間，都屬於開發流程。","check":"確認沒有人把參考解答當成手工實測。","transition":"現在把完成標準寫清楚。","sources":[]}},{"n":9,"title":"共同需求與完成標準","kind":"table","table":[["驗收","功能","要看到的結果"],["A1–A2","清單與搜尋","兩天 70 筆、日期清楚、可搜尋講者"],["A3","日期與主題篩選","條件同時生效，多標籤皆可查"],["A4–A5","收藏與我的議程","無重複、可取消、依時間排序"],["A6","儲存與手機版","重新整理保留、390px 可操作"]],"widths":[170,290,676],"bottom":"比較任務能否完成；色彩、版型與視覺風格自由","notes":{"time":"13:39–13:41，2 分鐘","talk":"我們固定資料與 UX 邏輯，不固定畫面。所有議程兩天各 35 筆、共 70 筆；使用者能搜尋、用日期和主題一起篩選、收藏並保留即可。資料可能有多位講者與多個標籤，不能漏掉。","action":"快速指向 A1–A6 文件，確認學員找到表格。","check":"請一位學員說出 A3 的預期，例如 AI 搜尋加 Web 主題應為零筆。","transition":"接著定義如何計時。","sources":["S14"]}},{"n":10,"title":"實測規則","kind":"split","leftTitle":"初版","leftBig":"15 分鐘","leftText":"建置、等待、除錯、驗收\n全部計入本輪時間","rightTitle":"需求修改","rightBig":"5 分鐘","rightText":"修改與回歸檢查\n未完成就記錄截止狀態","bottom":"設定時間另計。沒有用量資料時填「未取得」","notes":{"time":"13:41–13:43，2 分鐘","talk":"設定與套件安裝另計。每輪從開始處理需求或程式計時，驗收也算進去。到截止時沒通過就保留未完成狀態。不要把截止的十五分鐘寫成十五分鐘完成。","action":"展示紀錄表的狀態與通過 ID 欄位。說明除錯時間包含在經過時間內，不能再加總一次。","check":"確認學員能區分未取得、未測及零。","transition":"最後把規格整理成可貼給工具的提示。","sources":[]}},{"n":11,"title":"短提示，先讓作品跑起來","kind":"list","subtitle":"上傳 HWDC 議程 JSON，不把資料塞進 prompt","items":[["想做什麼","做我的議程：搜尋、篩選、收藏"],["使用時要怎樣","重整後保留，日期清楚，手機能用"],["交給 Agent 發揮","UI 自由設計，做好後開預覽讓我試用"]],"bottom":"細節放附件與驗收表，發現問題再用人話補充","notes":{"time":"13:43–13:45，2 分鐘","talk":"人不需要先寫成工程規格才開始。上傳資料，講清楚想做什麼、用起來要怎樣，再讓 Agent 做出可試用的第一版。色彩、版型、字型都可以自由發揮。驗收表拿在自己手上，發現缺漏再描述操作與預期。","action":"展示 hwdc-agenda-2026.json 附件，再只貼 4 句短提示。可以邀請學員補充一個視覺想法，記下差異。","check":"學員知道 JSON 是附件，不需複製 70 筆資料；不把 UI 相似度當成功條件。","transition":"先從 Lovable 開始。","sources":["S14"]}},{"n":12,"title":"Lovable 操作示範","kind":"steps","items":[["建立專案並上傳附件","hwdc-agenda-2026.json ＋ 初版短提示"],["等待可操作預覽","查看生成進度與錯誤"],["實際驗收","檢查功能，再提出具體修正"]],"bottom":"記錄追加提示與可見用量，保留失敗項目","notes":{"time":"13:45–13:47，2 分鐘","talk":"這份提示已包含所有HWDC 公開議程附件。請用新專案，避免帶入既有功能。平台介面可能調整，以帳號當日畫面為準。如果先顯示計畫，需要進入建置才會改程式。","action":"示範建立專案、上傳 JSON，確認附件存在，再貼短提示送出。額度已用完者私下向講師取得群組加入方式。","check":"學員準備好送出提示及計時。","transition":"下一頁會固定顯示任務。","sources":["S2","S4","S14"]}},{"n":13,"title":"實作 A：Lovable","kind":"task","big":"15:00","subtitle":"初版建置與驗收","items":["送出短提示與 HWDC 議程附件","操作 A1–A6，記下失敗項","保存耗時、追加提示及用量"],"bottom":"額度用完：向講師取得群組加入方式；仍卡關時使用離線版","notes":{"time":"13:47–14:03，1 分鐘說明加 15 分鐘實作","talk":"計時從 13:48 開始。大家要在這十五分鐘裡建置並操作六個驗收項目。畫面出現後就開始檢查，不要把最後一分鐘全部留給驗收。","action":"第 5 分鐘提醒查看預覽。第 10 分鐘提醒轉入驗收。最後 2 分鐘提醒保存紀錄。依現場狀況走動但不逐台長時間排障。 額度用完者先由講師私下提供群組加入方式；仍無法接續時依 2 分鐘規則切離線版。","check":"完成條件是可操作初版及 A1–A6 紀錄。截止未完成同樣保留觀察。","transition":"時間到後一起回報完成狀態。","sources":["S14"]}},{"n":14,"title":"初版驗收與紀錄","kind":"image","image":"02-search-and-filter.png","subtitle":"搜尋、日期與主題條件要一起成立","side":["搜尋林建宏","日期選 10/14","選相符主題：1 筆"],"imageCaption":"A3：改成 10/15 或不相符主題時，應為 0 筆","notes":{"time":"14:03–14:05，2 分鐘","talk":"搜尋林建宏，日期選 10/14，主題選 AI 開發工具實戰和流程改造，應只剩 4996。改成 SDLC 相關議題為零，改 10/15 也為零。另以陳宜昌的三個主題標籤檢查多標籤是否遺漏。","action":"依 A3 實際切換條件，不要求特定按鈕位置。","check":"條件是 AND；同一場的多個 tags 都能被找出。","transition":"接下來從空白起點使用通用工具。","sources":["S14"]}},{"n":15,"title":"Codex 桌面 App 操作","kind":"steps","items":[["選擇 Codex","開啟本次 starter 的獨立副本"],["指定資料檔，貼短提示","同一份 UX 任務，讓 Agent 決定畫面"],["查看修改與預覽","確認啟動方式、檔案差異及錯誤"]],"bottom":"本輪使用全新起點，不帶入 Lovable 產生的程式","notes":{"time":"14:05–14:06，1 分鐘","talk":"今天以 Codex 桌面 App 示範通用開發代理。開啟正確資料夾很重要，工具需要看到這次實驗的檔案。其他工具沿用相同需求與資料即可。","action":"桌面選 Codex，開啟獨立 starter 副本。指出專案路徑與檔案清單。官方介面更新時，以軟體開發及本機資料夾功能辨認。","check":"確認沒有學員直接把第一條路徑的程式交給第二條路徑。","transition":"接著指出三份最重要的上下文。","sources":["S6"]}},{"n":16,"title":"專案上下文","kind":"list","items":[["短提示","描述想完成的任務，不預先指定元件"],["src/sessions.json","官方兩日議程快照，與附件內容一致"],["acceptance-v1.md","驗收操作邏輯，不比配色或像素"]],"bottom":"來源、格式與時區留在附件說明，方便接手","notes":{"time":"14:06–14:06:40，40 秒","talk":"這三份檔案讓需求不只存在聊天裡。以後更換工具或開新的對話時，也能讀到相同基準。驗收文件的作用是留下預期行為，不能由 AI 任意改寫來讓自己通過。","action":"打開三份檔案，示範在提示中引用名稱。","check":"學員知道資料的位置及共同規格。","transition":"接著確認結果如何執行。","sources":["S14"]}},{"n":17,"title":"執行與檢查","kind":"list","items":[["預覽有啟動","確認網址與終端機狀態"],["修改看得懂","知道改動哪些檔案及功能"],["結果有驗證","依 A1–A6 操作，記下仍有問題的項目"]],"bottom":"啟動失敗時，先保留原始錯誤訊息","notes":{"time":"14:06:40–14:07:20，40 秒","talk":"代理回覆已完成之後，仍需確認預覽真的可用。請看它改了哪些檔案，並保留錯誤原文。只有本機頁面開啟且驗收成立，才算對應功能完成。","action":"展示終端機及檔案差異入口。若預覽無法啟動，依兩分鐘備援規則繼續。","check":"學員知道如何找到錯誤資訊。","transition":"現在開始第二條路徑的計時。","sources":[]}},{"n":18,"title":"實作 B：通用 AI 工具","kind":"task","big":"15:00","subtitle":"從空白專案完成相同需求","items":["短提示＋相同 HWDC 議程資料","讓工具實作並啟動預覽","操作 A1–A6，記錄結果"],"bottom":"講師用 Codex App，你可以沿用已準備好的工具","notes":{"time":"14:07:20–14:23，40 秒說明加 15 分鐘實作","talk":"13:48 那一輪已經結束，請不要把未完成的工作混到這一輪。這次從 14:08 計時，依相同規格做一份新作品。","action":"14:08 開始，14:13 提醒看預覽，14:18 提醒驗收，14:21 提醒留紀錄，14:23 截止。","check":"完成條件是第二份可操作版本及六項紀錄。若使用備援，明示來源。","transition":"時間到，一起確認最容易漏掉的保存。","sources":["S14"]}},{"n":19,"title":"同標準驗收與紀錄","kind":"image","image":"03-my-schedule.png","subtitle":"重新整理後，收藏仍要保留","side":["收藏 4996、5030","切到我的議程","重新整理再確認"],"imageCaption":"參考解答示範 A4–A6。兩套工具使用同一張驗收表","notes":{"time":"14:23–14:25，2 分鐘","talk":"請確認我的議程只顯示收藏，排序正確，重新整理後仍在。保存是在同一瀏覽器與同一網址下比較。若埠號改變，瀏覽器會視為另一個來源。","action":"請學員記下本輪通過項目、時間及主要卡關原因，保留目前的收藏供下一輪檢查。","check":"兩條路徑都有可辨識的結果狀態。","transition":"現在需求要改變了。","sources":["S14"]}},{"n":20,"title":"新需求：收藏衝堂提示","kind":"image","image":"04-conflict-warning.png","subtitle":"使用者需要知道哪些收藏無法同時參加","side":["比較全部收藏","指出兩場與時段","由使用者自行決定"],"imageCaption":"第二版參考解答。提示不會自動移除收藏","notes":{"time":"14:25–14:25:20，20 秒","talk":"現在增加一個需求：讓使用者知道哪些收藏時間衝突。提醒要列出相關議程，但不自動取消任何收藏。","action":"展示第二版的衝堂區域，快速指出有兩場名稱與時段。","check":"學員理解修改的範圍。","transition":"先把邊界說清楚。","sources":["S14"]}},{"n":21,"title":"時間重疊案例","kind":"table","table":[["組合","時間關係（10/14）","預期"],["5030 + 5009","15:30–17:30／15:15–15:45","衝堂"],["4996 + 5018","13:00–15:00／13:30–14:00","衝堂"],["4996 + 4993","13:00–15:00／13:00–15:00","衝堂"],["4957 + 4958","10:00–10:10／10:10–10:55","不衝堂"]],"widths":[230,690,216],"bottom":"日期也要一起比較：4996（10/14）與 4992（10/15）不衝堂","notes":{"time":"14:25:20–14:25:40，20 秒","talk":"用真實場次練習邊界：5030 和 5009 部分重疊；4996 包含 5018；4996 和 4993 同時段；4957 結束 10:10 正好接 4958，因此不衝堂。再比 4996 和 4992，鐘點相同但日期不同，不能誤報。","action":"每次只收藏兩場，檢查完整日期時間。數學判斷式可放講義，不必要求大家把它寫進首輪提示。","check":"區分部分重疊、包含、相同、首尾相接與跨日。","transition":"最後補上修改時必須保留的行為。","sources":["S14"]}},{"n":22,"title":"修改也用簡單的話","kind":"image","image":"07-filter-still-warns.png","subtitle":"「提醒我哪些收藏衝堂，讓我自己決定」","side":["保留原有收藏","只增加衝堂功能","完成後重做驗收"],"imageCaption":"搜尋只顯示一場，仍提醒全部收藏的衝突","notes":{"time":"14:25:40–14:26，20 秒","talk":"這個提醒要看全部收藏，不受目前搜尋與篩選影響。請維持原來的儲存鍵與格式，避免改完功能卻清掉收藏。","action":"請學員開啟 prompt-revision-v2.txt。指出其中的保留條件及驗收案例。","check":"學員準備好在各自的第一版繼續修改。","transition":"開始各五分鐘。","sources":["S14"]}},{"n":23,"title":"兩套工具各修改一次","kind":"task","big":"5 + 5","subtitle":"每套工具 5 分鐘，包含修改與驗收","items":["先在 Lovable 修改","再在通用工具修改","兩份結果分別記錄"],"bottom":"到時保存狀態，14:36 開始共同回歸檢查","notes":{"time":"14:26–14:36，共 10 分鐘","talk":"先用五分鐘修改 Lovable，14:31 切換通用工具。兩條路徑各保留自己的提示與結果，不互相複製程式。若額度不足，先保留狀態並向講師取得群組加入方式。若改變實作環境，記錄切換前後的條件，確認仍是自己的初版專案及收藏；無法接續時使用備援版驗收。","action":"14:26 開始第一段，14:29 提醒驗收，14:31 切換，14:34 提醒驗收，14:36 截止。","check":"完成條件是 B1–B6 的結果紀錄。沒有測到的項目填未測。","transition":"一起檢查修改有沒有影響原功能。","sources":[]}},{"n":24,"title":"回歸檢查","kind":"image","image":"05-adjacent-no-conflict.png","subtitle":"新功能與原有功能都要成立","side":["首尾相接不提醒","取消收藏即時更新","A1–A6 仍通過"],"imageCaption":"4957 與 4958 於 10:10 相接，不誤報衝堂","notes":{"time":"14:36–14:40，4 分鐘","talk":"加入新功能後重做 A1–A6。特別確認第一版原有收藏沒有遺失，日期與多標籤篩選仍正確。此圖展示 4957 與 4958 相接沒有提示。","action":"保留約兩分鐘操作，再邀請兩位學員各用一句話分享：一個成功案例或一個預期與實際不符的地方。","check":"學生知道 AI 修改也可能破壞舊功能，紀錄可重現。","transition":"接著用紀錄討論效率。","sources":["S14"]}},{"n":25,"title":"上一輪彩排觀察","kind":"table","subtitle":"舊條件：長提示、12 筆合成資料、指定配色","table":[["開發方式","初版含驗收","修改含回歸"],["手工開發","未取得","未取得"],["Lovable","4 分 22 秒｜6/6","核心 3 分 33 秒\n手機於截止後補測"],["Codex App","1 分 55 秒｜6/6","1 分 3 秒｜6/6"]],"widths":[290,423,423],"bottom":"看過解答且交錯操作，非工具排名；新版短提示尚未重測","notes":{"time":"14:40–14:43，3 分鐘","talk":"這是上次長提示與 12 筆合成資料的操作彩排。兩套最後都完成。Codex 初版約 1 分 55 秒、修改約 1 分 3 秒；Lovable 初版約 4 分 22 秒、修改核心約 3 分 33 秒，精確手機尺寸在截止後補測。代理已看過解答，且第二輪交錯操作，不能據此排名。新版改用真實附件、短提示和自由 UI，必須另測。 詳細紀錄見 evidence/rehearsal-observations.md。","action":"先比較通過項目，再看時間與限制。補充 Lovable 衝堂區可直接取消，Codex 由卡片取消，示範 UX 路徑的差異。","check":"觀察時間不被解讀成普遍速度；沒有把舊成績當作新條件成績。","transition":"我們用一個可重現錯誤來看除錯工作。","sources":[]}},{"n":26,"title":"除錯案例：首尾相接","kind":"debug","subtitle":"刻意植入的教學錯誤，非工具實測失誤","wrong":"a.start \u003c= b.end && b.start \u003c= a.end","correct":"a.start \u003c b.end && b.start \u003c a.end","items":["現象：4957 與 4958 被誤判衝堂","重現：收藏 10:00–10:10 與 10:10–10:55","驗證：相接與跨日不提醒，重疊仍提醒"],"notes":{"time":"14:43–14:45，2 分鐘","talk":"若沒有適合教學的實測錯誤，就用明確標示的刻意植入案例。把小於寫成小於等於會使 4957 與 4958 首尾相接被誤判。修正後，真正重疊仍應提醒，跨日不能混在一起。","action":"指出兩個等號，說明最小修改。請學員以 4996+5030 與 4996+5018 成對驗證。","check":"學員能說出修正後要測的兩種結果。","transition":"接著把時間與費用放在一起看。","sources":[]}},{"n":27,"title":"費用與開發工時","kind":"list","items":[["固定費用","訂閱費與分攤假設"],["額外用量","加購、API 費用及原始單位"],["人的投入","主動操作與等待分開記錄"]],"bottom":"專案估算＝訂閱分攤＋額外用量費＋人工作業時數 × 時薪","notes":{"time":"14:45–14:48，3 分鐘","talk":"不同平台的點數不能直接當成相同價值。訂閱包含的額度、額外付費與人的時間需要分開。Codex 以 ChatGPT 登入和 API 金鑰登入適用不同計費口徑。公式中的費率與分攤都要寫清楚。 使用講師提供群組者，額度來源要註明；若無法取得個人消耗數據，填未取得，不把講師提供當作工具成本為零。","action":"以學員紀錄表找出可取得與不可取得的欄位。沒有值就保留公式，跨幣別先交代匯率與日期。","check":"學員不把未知用量當零，也不重複加總除錯時間。","transition":"還有一些影響後續使用的成本，今天只能觀察指標。","sources":["S4","S7","S8"]}},{"n":28,"title":"同一個 UX，不同的 UI","kind":"image","image":"06-mobile.png","portrait":true,"subtitle":"讓同學試用相同任務，再討論操作差異","side":["找到想聽的議程","收藏後能找回來","衝堂看得懂、能處理","視覺風格各自發揮"],"imageCaption":"參考畫面非標準答案；390px 仍須可操作","notes":{"time":"14:48–14:50，2 分鐘","talk":"讓兩位學員用不同 UI 展示同一任務：找到議程、收藏、看衝堂、決定取消或保留。上一輪 Lovable 在提醒區直接加取消按鈕，Codex 由卡片取消；兩者都能完成，但步驟不同。討論這些操作是否清楚，再分享個人的視覺風格。","action":"邀請鄰座互相試用 60 秒，再以 60 秒分享差異；不投票選工具冠軍。","check":"能區分 UX 任務與 UI 表現，使用者找得到下一步。","transition":"把這些觀察帶回自己的工作情境。","sources":["S2","S5","S14"]}},{"n":29,"title":"情境選型表","kind":"table","subtitle":"先確定工作條件，再選擇起手方式","table":[["情境","先檢查的條件","選型方向"],["快速驗證新想法","預覽速度、流程契合、額度","評估場景工具"],["修改既有專案","檔案、工具鏈、測試與權限","評估通用工具"],["持續迭代與交接","回歸、程式碼、知識與成本","依紀錄調整組合"]],"widths":[310,490,336],"bottom":"此表是決策框架，個別專案仍需驗證","notes":{"time":"14:50–14:52，2 分鐘","talk":"選型從工作條件開始。要快速驗證新 Web 想法時，看看場景整合能節省哪些步驟。既有專案則先確認工具能否處理現有檔案與測試。持續維護需要累積更多紀錄，再調整組合。","action":"請學員寫下下一個真實專案及最重要的驗收條件。","check":"學員給的理由能連結到本次觀察，不只說偏好某個品牌。","transition":"用 PDCA 把這種選擇變成可以重複的流程。","sources":[]}},{"n":30,"title":"PDCA 與專案知識管理","kind":"list","items":[["Plan　留下規格與完成標準","需求、資料、限制與驗收案例"],["Do／Check　保留程式與驗證","實際執行、紀錄錯誤、檢查回歸"],["Act　依結果調整下一輪","修改範圍、提示、工具與模型投入"]],"bottom":"工具換了，需求與驗收紀錄仍能沿用","notes":{"time":"14:52–14:54，2 分鐘","talk":"把今天做過的事情連回 PDCA。Plan 是我們固定的需求與資料，Do 是建置，Check 是驗收，Act 是修改方式與下一輪的選擇。模型能力的調整也應根據任務難度與驗收結果，不能只看單次價格。","action":"指出專案中需求、紀錄及錯誤重現三類文件。請學員保留一個下一輪要改善的點。","check":"學員知道如何把一次體驗變成可重複流程。","transition":"最後看教材裡能接著練什麼。","sources":[]}},{"n":31,"title":"課後延伸與教材導覽","kind":"list","items":[["學員講義與提示","可直接沿用到下一個專案"],["兩版參考解答","比對 UX 邏輯，不要求畫面長一樣"],["行事曆匯出練習","將收藏輸出為 .ics 並驗證時間"]],"bottom":"保留自己的實驗紀錄，再打開參考答案","notes":{"time":"14:54–14:55，1 分鐘","talk":"講義整理了今天的步驟與提示，兩版解答供課後比對。完成者可練習行事曆匯出，注意時區及中文文字。先保留自己的紀錄，才能看出自己在哪一步需要改善。","action":"展示教材資料夾及 extension-ics.md 的位置。","check":"學員知道離線版本、講義和參考答案的位置。","transition":"最後五分鐘開放問題。","sources":[]}},{"n":32,"title":"Q&A","kind":"question","big":"你的下一個專案\n會先用哪套工具？","subtitle":"請用一個驗收條件，說明你的選擇","notes":{"time":"14:55–15:00，5 分鐘","talk":"歡迎分享今天遇到的需求理解、修改或驗收問題。也可以把下一個專案的條件說出來，我們一起檢查選型理由。","action":"優先回覆能讓全場受益的問題。個別安裝問題留待課後。15:00 準時結束。","check":"學員至少能說出一個條件與相對應的觀察。","transition":"謝謝大家，教材可繼續用於課後練習。","sources":[]}},{"n":33,"title":"Codex CLI 對應操作","kind":"code","subtitle":"附錄：已完成安裝與登入時","code":"cd 你的專案資料夾\ncodex\n\n/status","items":["同樣引用需求、資料與驗收文件","/status 查看可取得的用量狀態","詳細安裝方式依官方文件"],"notes":{"time":"附錄，視問題使用","talk":"桌面 App 與 CLI 都可在專案上下文中工作。這裡示範最少的對應操作，不要求全場臨時換介面。CLI 需要先完成安裝和登入，設定與可用功能仍應記錄。","action":"在準備好的專案資料夾啟動 codex，引用相同檔案。需要查看額度時用 /status。","check":"學員知道 CLI 是另一個操作入口，並非本課額外必裝工具。","transition":"回到實作或 Q&A。","sources":["S8","S9"]}},{"n":34,"title":"macOS／Windows 環境檢查","kind":"code","subtitle":"附錄：在含 package.json 的資料夾執行","code":"node --version\nnpm --version\nnpm ci\nnpm run dev","items":["macOS：終端機進入專案目錄","Windows：在資料夾開啟終端機","採 Node.js 24，預先安裝套件"],"notes":{"time":"附錄，準備時段使用","talk":"第一次 npm ci 需要網路。請讀取錯誤原文，不要盲目重試。版本不符先完成環境或改用備援，本課不安排逐台重裝。","action":"指向套件安裝及本機網址，說明埠號已使用時工具可能改用其他埠。","check":"學員能分辨資料夾錯誤、版本錯誤與套件下載失敗。","transition":"兩分鐘無法接續時切備援。","sources":[]}},{"n":35,"title":"額度、網路與啟動問題","kind":"table","table":[["狀況","先留下的紀錄","接續方式"],["Lovable 額度用完","餘額與未完成項目","向講師取得群組加入方式"],["服務無回應","當下畫面與時間","換本機參考版"],["本機啟動失敗","指令與錯誤原文","2 分鐘後切備援"],["收藏沒有保留","網址、埠號、儲存警告","確認同一來源"]],"widths":[310,410,416],"notes":{"time":"附錄，現場排錯使用","talk":"Lovable 的 5 點已用完或額度不足時，講師會私下提供群組加入方式。加入後確認可以繼續操作；若仍無法建置或服務中斷，再使用離線參考版。使用個人額度、講師群組或離線版，皆在紀錄中註明，保留切換原因。","action":"先提供群組加入協助；仍無法接續者，打開 offline/reference-v1.html 做驗收。","check":"學員知道如何維持進度與紀錄來源。","transition":"回到下一個教學步驟。","sources":[]},"bottom":"群組加入後仍無法建置時，使用離線參考版驗收"},{"n":36,"title":"進階練習：匯出行事曆","kind":"list","items":[["輸出收藏議程","每場一個 VEVENT，保留穩定 UID"],["處理時間與文字","UTC、中文、逗號、分號與換行"],["驗證匯入結果","沒有漏場、時間正確、相同事件可辨識"]],"bottom":"教材包含延伸提示與參考實作，主課不必完成","notes":{"time":"附錄，課後延伸","talk":"匯出 ICS 是一個很好的需求延伸題。除了把字串拼起來，還要處理時區、文字跳脫、CRLF 與長行折行。參考實作依 RFC 5545 的相關格式，正式使用前仍需驗證目標行事曆。","action":"開啟 extension-ics.md，指出測試例子與下載動作。","check":"學員能說出至少一個畫面以外的驗收問題，例如 UTC 換算。","transition":"回到教材導覽。","sources":["S10"]}},{"n":37,"title":"完整實測紀錄表","kind":"table","subtitle":"附錄：可直接複製 measurement-template.md","table":[["分類","必填內容","缺資料時"],["條件","工具、模型、方案、版本、起始狀態","未取得／未揭露"],["結果","時間、通過 ID、完成或截止狀態","未測"],["投入","追加提示、主動工時、等待、用量","未取得"],["證據","提示、截圖、程式、錯誤與修正","明確記錄原因"]],"widths":[180,730,226],"notes":{"time":"附錄，填表時使用","talk":"有用的紀錄要能追溯條件。請寫驗收 ID，而不是只有感想。未取得、未測與零有不同意義：沒有查到用量不能填零，没有測功能不能填通過。 使用講師提供群組時，記下額度來源與切換時間。看不到個人用量時標示未取得。","action":"開啟完整範本，示範如何記下截止未完成及用量未知。","check":"學員能依自己的資料填表，不虛構缺值。","transition":"需要更新簡報時，從這份紀錄取數。","sources":[]}},{"n":38,"title":"來源、版本與查核日期","kind":"list","subtitle":"公開文件查核：2026-10-13","items":[["HWDC 官方議程附件","70 筆公開資料、來源、日期與時區"],["Lovable 官方文件","技術堆疊、Git 同步、方案與額度"],["OpenAI 官方文件與 RFC 5545","桌面／CLI 操作、計費口徑、行事曆格式"]],"bottom":"完整連結在講者備註及 evidence/sources.md","notes":{"time":"附錄，供查閱","talk":"議程附件是官網公開快照，70 筆場次與 12 筆休息原始資料分開保存。來源、擷取日期、台北時區正規化有紀錄，開課兩套工具使用同一份。主辦資訊以官網為準。","action":"需要追溯來源時開啟 sources.md。","check":"來源與限制可辨識。","transition":"結束。","sources":["S1","S2","S3","S4","S5","S6","S7","S8","S9","S10","S11","S12","S13","S14"]}}];let current=Math.min(38,Math.max(1,Number(location.hash.slice(1))||4));const img=document.querySelector('#slide'),select=document.querySelector('#select'),notes=document.querySelector('#notes');function show(){const s=slides[current-1];img.src=String(current).padStart(2,'0')+'.png';img.alt=s.title;select.value=current;document.querySelector('#count').textContent=current+' / 38';notes.textContent='時間：'+s.notes.time+'\n\n講述：'+s.notes.talk+'\n\n操作：'+s.notes.action+'\n\n檢核：'+s.notes.check+'\n\n轉場：'+s.notes.transition;history.replaceState(null,'','#'+current);}document.querySelector('#prev').onclick=()=>{current=Math.max(1,current-1);show();};document.querySelector('#next').onclick=()=>{current=Math.min(38,current+1);show();};select.onchange=()=>{current=Number(select.value);show();};document.querySelector('#toggle').onclick=()=>notes.hidden=!notes.hidden;document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();current=Math.min(38,current+1);show();}if(e.key==='ArrowLeft'){current=Math.max(1,current-1);show();}if(e.key.toLowerCase()==='n')notes.hidden=!notes.hidden;});show();</script></body></html>
